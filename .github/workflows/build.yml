name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build APK
        run: gradle -p android assembleRelease --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: devils_revolver_android
          path: android/app/build/outputs/apk/release/*.apk

  gba:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
      - name: Build ROM
        run: make
      - name: Fix header for real hardware (devkitPro gbafix)
        run: |
          docker run --rm -v "$PWD:/w" -w /w devkitpro/devkitarm \
            /opt/devkitpro/tools/bin/gbafix devils_revolver.gba -tDEVILREVOLVR -cADRE -mHX
      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: devils_revolver_gba
          path: devils_revolver.gba

  release:
    # publish the newest builds from main as the "latest-build" release, so the
    # APK can be downloaded straight to a phone
    if: github.ref == 'refs/heads/main'
    needs: [android, gba]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp out/devils_revolver_android/*.apk DevilsRevolver.apk
          cp out/devils_revolver_gba/devils_revolver.gba DevilsRevolver.gba
          gh release delete latest-build --cleanup-tag -y || true
          gh release create latest-build DevilsRevolver.apk DevilsRevolver.gba \
            --target "$GITHUB_SHA" --latest \
            --title "Latest build" \
            --notes "Automatic build of ${GITHUB_SHA::7}. Install DevilsRevolver.apk on Android; DevilsRevolver.gba runs on GBA hardware/emulators."
